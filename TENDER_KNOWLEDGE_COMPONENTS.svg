<text x="420" y="36" font-size="23" font-weight="bold" fill="#fff">خدمات التطبيق</text>
<text x="420" y="73" font-size="18" fill="#ebf3ea">حفظ مصدر وإصدار وصلاحية  ·  تطبيق نموذج واعتماد تقدير</text>
</g>
<g transform="translate(80 354)">
